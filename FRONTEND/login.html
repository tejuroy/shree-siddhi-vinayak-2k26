<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Shree Siddhi Vinayak</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-logo">
            🚩
        </div>

        <h1>
            SHREE SIDDHI VINAYAK
        </h1>

        <p class="association">
            YOUTH ASSOCIATION
        </p>

        <p class="location">
            📍 Sasalmari Camp
        </p>

        <div class="login-box">

            <h2>Login</h2>

            <p>
                Access Fund Management Dashboard
            </p>

            <form id="loginForm">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    LOGIN
                </button>

                <p id="loginMessage"></p>

            </form>

        </div>

        <p class="footer-text">
            🙏 Ganapathi Bappa Morya!
        </p>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
